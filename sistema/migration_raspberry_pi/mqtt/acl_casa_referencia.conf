# ACL del broker casa. Cada cliente solo accede a sus topics.
# Los topics del entorno definitivo (huerto/final/...) NO existen aquí.

# ESP32 de pruebas (casa): solo su propio árbol
user esp32_casa_01
topic readwrite huerto/casa/esp32_01/#

# Simulador: árbol independiente; no puede tocar al ESP32 real
user simulador_casa
topic readwrite huerto/casa/sim_01/#

# Node-RED: todos los dispositivos de casa
user nodered_casa
topic readwrite huerto/casa/#
topic read $SYS/#

# Administrador (diagnóstico con mosquitto_sub/pub)
user admin_casa
topic readwrite huerto/casa/#
topic read $SYS/#
