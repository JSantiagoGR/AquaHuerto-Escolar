# Listener ADICIONAL y autenticado para el sistema de riego en la Raspberry Pi.
# Se agrega como archivo en /etc/mosquitto/conf.d/ SIN modificar la configuración
# existente de Equipo 2. Con per_listener_settings cada puerto conserva sus reglas:
# 1883 queda como está (práctica anterior) y 1884 exige usuario + ACL.
#
# IMPORTANTE: per_listener_settings debe declararse una sola vez y ANTES de los
# listeners. Si /etc/mosquitto/mosquitto.conf ya define listeners o seguridad, revisar
# con el instalador (ver MIGRACION_RASPBERRY_PI.md, sección "Broker").
per_listener_settings true

listener 1884
allow_anonymous false
password_file /etc/mosquitto/riego_passwd
acl_file /etc/mosquitto/riego_acl.conf
