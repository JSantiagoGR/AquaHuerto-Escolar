# =====================================================================
# Broker MQTT del ENTORNO CASA - Riego inteligente (Mosquitto 2.1.2)
# Lo inicia scripts\iniciar_todo.ps1 como proceso del usuario.
# El firewall de Windows solo permite la subred local en red Privada
# (reglas "Riego Casa - MQTT 1883 (LAN)"). No se expone a internet.
# =====================================================================
allow_anonymous false
password_file C:/ESP32_Riego_Automatico/Pruebas_Casa_ESP32_v1/mqtt/passwd
acl_file C:/ESP32_Riego_Automatico/Pruebas_Casa_ESP32_v1/mqtt/acl.conf

# Todas las interfaces locales: el ESP32 llega por Wi-Fi
listener 1883

# Persistencia de retenidos y sesiones (sobrevive a reinicios)
persistence true
persistence_location C:/ESP32_Riego_Automatico/Pruebas_Casa_ESP32_v1/mqtt/data_usuario/
autosave_interval 300

# Limites
max_packet_size 262144
max_queued_messages 500
max_inflight_messages 20
max_keepalive 120

# Registro
log_dest file C:/ESP32_Riego_Automatico/Pruebas_Casa_ESP32_v1/mqtt/log/broker_usuario.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
