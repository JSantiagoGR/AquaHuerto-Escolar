# =====================================================================
# Broker MQTT del ENTORNO CASA - Riego inteligente (Mosquitto 2.1.2)
# Lo carga el servicio de Windows "mosquitto" mediante include_dir
# (ver configs/admin_configurar_broker_firewall.ps1).
# NO expone el broker a internet: el firewall solo permite la subred local.
# =====================================================================
allow_anonymous false
password_file C:/ESP32_Riego_Automatico/Pruebas_Casa_ESP32_v1/mqtt/passwd
acl_file C:/ESP32_Riego_Automatico/Pruebas_Casa_ESP32_v1/mqtt/acl.conf

# Escucha en todas las interfaces locales (el ESP32 llega por Wi-Fi).
# El firewall de Windows limita el acceso a la subred local (LocalSubnet).
listener 1883

# Persistencia de mensajes retenidos y sesiones (sobrevive a reinicios)
persistence true
persistence_location C:/ESP32_Riego_Automatico/Pruebas_Casa_ESP32_v1/mqtt/data/
autosave_interval 300

# Limites para evitar abusos o mensajes gigantes
max_packet_size 262144
max_queued_messages 500
max_inflight_messages 20
max_keepalive 120

# Registro
log_dest file C:/ESP32_Riego_Automatico/Pruebas_Casa_ESP32_v1/mqtt/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
